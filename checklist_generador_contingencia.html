<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2b4a">
<title>Checklist Generador – Contingencia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a2b4a;font-size:14px;}
.top-header{background:#1a2b4a;color:white;padding:14px 20px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.top-header-row{display:flex;align-items:center;gap:10px;padding-bottom:12px;}
.header-icon{font-size:24px;color:#f5a623;}
.header-text h1{font-size:16px;font-weight:700;}
.header-text .sub{font-size:11px;color:#8fa3c0;margin-top:1px;}
.badge-cont{margin-left:auto;background:#c0392b;color:white;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.progress-strip{border-top:1px solid #243655;padding:6px 0 0;}
.progress-meta{font-size:11px;color:#8fa3c0;margin-bottom:4px;}
.progress-track{height:4px;background:#243655;border-radius:2px;}
.progress-fill{height:4px;background:#f5a623;border-radius:2px;transition:width .3s;}
.timer-strip{background:#1e3357;display:flex;align-items:center;gap:14px;padding:7px 20px;border-bottom:1px solid #243655;}
.timer-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:#4cd964;letter-spacing:1px;}
.timer-val.warn{color:#f5a623;}.timer-val.crit{color:#e74c3c;}
.timer-label{font-size:11px;color:#8fa3c0;margin-top:1px;}
.timer-btns{display:flex;gap:6px;margin-left:auto;}
.tbtn{border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.tbtn-start{background:#27ae60;color:white;}.tbtn-stop{background:#c0392b;color:white;}.tbtn-reset{background:#344d6e;color:#8fa3c0;}
.gen-tab-bar{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#e8ecf1;border-bottom:2px solid #d0d7e3;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.gen-tab{border:2px solid #c0cad6;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;background:white;color:#5a6a82;cursor:pointer;white-space:nowrap;transition:all .15s;}
.gen-tab:hover{border-color:#1a2b4a;color:#1a2b4a;}
.gen-tab.active{background:#1a2b4a;color:white;border-color:#1a2b4a;}
.gen-tab.has-items{border-color:#27ae60;color:#1a7a3c;}
.gen-tab.active.has-items{background:#1e6e40;border-color:#1e6e40;color:white;}
.btn-add-gen{border:2px dashed #8fa3c0;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;background:transparent;color:#8fa3c0;cursor:pointer;white-space:nowrap;}
.btn-add-gen:hover{border-color:#1a2b4a;color:#1a2b4a;}
.os-banner{background:#1a2b4a;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:3px solid #f5a623;}
.os-field{display:flex;flex-direction:column;gap:3px;}
.os-field label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#8fa3c0;}
.os-field input{border:1px solid #344d6e;border-radius:6px;padding:5px 9px;font-size:13px;font-weight:700;color:white;background:#243655;outline:none;min-width:130px;}
.os-field input:focus{border-color:#f5a623;background:#2d4a7a;}
.os-field input::placeholder{color:#5a7a9a;font-weight:400;}
.os-sep{color:#344d6e;font-size:18px;align-self:flex-end;padding-bottom:4px;}
.main{padding:14px 14px 32px;max-width:900px;margin:0 auto;}
.gen-panel{display:none;}.gen-panel.active{display:block;}
.card{background:white;border-radius:10px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden;}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid #edf0f4;cursor:pointer;user-select:none;}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;}
.card-badge{background:#edf0f4;color:#1a2b4a;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
.card-badge.done{background:#d4f0de;color:#1a7a3c;}.card-badge.warn{background:#fef3cd;color:#8a6000;}
.card-chevron{font-size:11px;color:#8fa3c0;transition:transform .2s;margin-left:6px;}
.card-chevron.open{transform:rotate(180deg);}
.card-body{padding:0;}
.fields-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px;}
.fields-grid.cols2{grid-template-columns:repeat(2,1fr);}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#8fa3c0;margin-bottom:3px;}
.field input,.field select{width:100%;border:1px solid #dde2ea;border-radius:6px;padding:6px 8px;font-size:13px;color:#1a2b4a;background:#f7f9fb;outline:none;}
.field.span2{grid-column:span 2;}
.item{display:flex;align-items:flex-start;gap:11px;padding:10px 18px;border-bottom:1px solid #f0f3f7;cursor:pointer;}
.item:last-child{border-bottom:none;}
.item:hover{background:#fafbfd;}.item.done{background:#f3fbf6;}
.item.done .item-desc{color:#8fa3c0;}
.check-box{width:20px;height:20px;min-width:20px;border:2px solid #d0d7e3;border-radius:4px;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.check-box.on{background:#27ae60;border-color:#27ae60;}
.check-box.on::after{content:'✓';color:white;font-size:12px;font-weight:800;}
.item-num{font-size:11px;color:#b0b9c8;min-width:16px;margin-top:2px;font-weight:600;}
.item-body{flex:1;}
.item-desc{font-size:13px;line-height:1.4;}
.item-hint{font-size:11px;color:#8fa3c0;margin-top:2px;font-style:italic;}
.item-inputs{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;align-items:center;}
.item-inputs label{font-size:10px;text-transform:uppercase;color:#8fa3c0;font-weight:700;}
.item-inputs input,.item-inputs select{border:1px solid #dde2ea;border-radius:5px;padding:4px 7px;font-size:12px;background:#f7f9fb;}
.item-inputs input{width:80px;}.item-inputs input.w120{width:120px;}.item-inputs input.w160{width:160px;}
.alert-banner{display:none;gap:7px;background:#fde8e8;border:1px solid #f5c6cb;border-radius:7px;margin:0 18px 8px;padding:8px 11px;font-size:12px;color:#c0392b;}
.alert-banner.show{display:flex;}.alert-banner.yellow{background:#fef9e7;border-color:#fde68a;color:#8a6000;}
.ronda-ctrl{display:flex;align-items:center;gap:8px;padding:8px 18px;background:#f7f9fb;border-bottom:1px solid #edf0f4;}
.ronda-lbl{font-size:12px;font-weight:700;}
.btn-add-ronda{margin-left:auto;border:none;border-radius:6px;background:#1a2b4a;color:white;font-size:11px;font-weight:700;padding:5px 11px;cursor:pointer;}
.ronda-block{border-left:3px solid #3b82f6;margin:8px 18px;border-radius:0 8px 8px 0;background:#f7f9fb;padding:9px 13px;}
.ronda-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:7px;}
.ronda-top strong{font-size:12px;}.ronda-top label{font-size:10px;text-transform:uppercase;color:#8fa3c0;font-weight:700;}
.ronda-top input{border:1px solid #dde2ea;border-radius:5px;padding:3px 6px;font-size:12px;background:white;}
.readings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.readings-grid label{font-size:10px;text-transform:uppercase;color:#8fa3c0;font-weight:700;display:block;margin-bottom:2px;}
.readings-grid input{width:100%;border:1px solid #dde2ea;border-radius:5px;padding:5px 6px;font-size:12px;background:white;}
.ronda-notes{margin-top:7px;}
.ronda-notes label{font-size:10px;text-transform:uppercase;color:#8fa3c0;font-weight:700;display:block;margin-bottom:2px;}
.ronda-notes input{width:100%;border:1px solid #dde2ea;border-radius:5px;padding:5px 6px;font-size:12px;background:white;}
.sec-divider{font-size:10px;font-weight:700;text-transform:uppercase;color:#8fa3c0;padding:9px 18px 3px;border-top:1px solid #f0f3f7;}
.footer-btns{display:flex;gap:10px;margin-top:4px;}
.btn-print{flex:1;padding:12px;background:#1a2b4a;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;}
.btn-reset-all{padding:12px 18px;background:#edf0f4;color:#5a6a82;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
@media(max-width:640px){.fields-grid{grid-template-columns:1fr 1fr;}.readings-grid{grid-template-columns:1fr 1fr;}.main{padding:8px 8px 28px;}.card{margin-bottom:8px;}.item{padding:11px 13px;}.timer-val{font-size:24px;}.top-header{padding:10px 12px 0;}.os-banner{padding:8px 12px;}.os-field input{min-width:110px;}}
@media print{.top-header{position:static;}.gen-tab-bar,.timer-btns,.btn-print,.btn-reset-all,.btn-add-ronda,.btn-add-gen{display:none!important;}body{background:white;}.card{box-shadow:none;border:1px solid #dde2ea;}.gen-panel{display:block!important;}}
</style>
</head>
<body>
<div class="top-header">
  <div class="top-header-row">
    <div class="header-icon">⚡</div>
    <div class="header-text"><h1>Checklist Mantenimiento de Generadores</h1><div class="sub">Solo durante operación continua · Motor encendido</div></div>
    <div class="badge-cont">CONTINGENCIA &gt;2 HRS</div>
  </div>
  <div class="progress-strip">
    <div class="progress-meta" id="prog-meta">0 de 22 ítems revisados</div>
    <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
</div>
<div class="timer-strip">
  <div><div class="timer-val" id="timer">00:00:00</div><div class="timer-label" id="timer-lbl">Motor detenido · Presiona Iniciar al arrancar</div></div>
  <div class="timer-btns">
    <button class="tbtn tbtn-start" onclick="startTimer()">▶ Iniciar</button>
    <button class="tbtn tbtn-stop" onclick="stopTimer()">⏹ Detener</button>
    <button class="tbtn tbtn-reset" onclick="resetTimer()">↺</button>
  </div>
</div>
<div class="gen-tab-bar" id="gen-tab-bar"></div>
<div id="gen-panels"></div>
<script>
var timerIv=null,t0=null,elapsed=0;
function startTimer(){if(timerIv)return;t0=Date.now()-elapsed;timerIv=setInterval(function(){var ms=Date.now()-t0,h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);var el=document.getElementById('timer');el.textContent=p(h)+':'+p(m)+':'+p(s);el.className=h>=3?'timer-val crit':h>=2?'timer-val warn':'timer-val';document.getElementById('timer-lbl').textContent=h>=3?'⚠️ Más de 3 horas':h>=2?'Contingencia larga':'Motor en operación';},1000);var fi=currentPanel().querySelector('.f-inicio');if(fi&&!fi.value){var n=new Date();fi.value=n.toTimeString().slice(0,5);}}
function stopTimer(){if(!timerIv)return;elapsed=Date.now()-t0;clearInterval(timerIv);timerIv=null;document.getElementById('timer-lbl').textContent='Motor detenido';}
function resetTimer(){stopTimer();elapsed=0;document.getElementById('timer').textContent='00:00:00';document.getElementById('timer').className='timer-val';document.getElementById('timer-lbl').textContent='Motor detenido · Presiona Iniciar al arrancar';}
function p(n){return n<10?'0'+n:n;}
var SECS={s1:['i1','i2','i3','i4','i5','i6'],s2:['i7','i8','i9','i10','i11','i12'],s3:['i13','i14','i15','i16'],s4:['i17','i18','i19','i20','i21','i22']};
var genStates={},genRondas={},currentGen=1,genCount=1,MAX_GENS=7;
function currentPanel(){return document.getElementById('gen-panel-'+currentGen);}
function initGenData(g){genStates[g]={};genRondas[g]=1;}
function tick(g,id,sec){var st=genStates[g];st[id]=!st[id];var panel=document.getElementById('gen-panel-'+g);var item=panel.querySelector('#g'+g+'_'+id);if(item)item.classList.toggle('done',st[id]);var cb=panel.querySelector('#g'+g+'_c'+id.replace('i',''));if(cb)cb.classList.toggle('on',st[id]);updateBadge(g,sec);if(g===currentGen)updateProgress(g);updateTabStyle(g);}
function updateBadge(g,sec){var items=SECS[sec],done=items.filter(function(i){return genStates[g][i];}).length;var el=document.getElementById('g'+g+'_b_'+sec);if(el){el.textContent=done+' / '+items.length;el.className=done===items.length?'card-badge done':done>0?'card-badge warn':'card-badge';}}
function updateProgress(g){var all=[].concat.apply([],Object.values(SECS)),done=all.filter(function(i){return genStates[g][i];}).length;var pct=Math.round(done/all.length*100);document.getElementById('prog-fill').style.width=pct+'%';document.getElementById('prog-meta').textContent='Gen '+g+': '+done+' de '+all.length+' ítems revisados';}
function toggleCard(h){var b=h.nextElementSibling,ch=h.querySelector('.card-chevron'),hidden=b.style.display==='none';b.style.display=hidden?'':'none';ch.classList.toggle('open',hidden);}
function addRonda(g){genRondas[g]++;var n=genRondas[g];var wrap=document.getElementById('g'+g+'_rondas');var d=document.createElement('div');d.className='ronda-block';d.innerHTML='<div class="ronda-top"><strong>Ronda '+n+'</strong><label>Hora</label><input type="time"><label>Responsable</label><input type="text" placeholder="..." style="width:110px"></div><div class="readings-grid"><div><label>Tensión L-L (V)</label><input type="number" placeholder="V"></div><div><label>Tensión L-N (V)</label><input type="number" placeholder="V"></div><div><label>Corriente (A)</label><input type="number" placeholder="A"></div><div><label>Frecuencia (Hz)</label><input type="number" placeholder="Hz"></div><div><label>Presión aceite (kPa)</label><input type="number" placeholder="kPa"></div><div><label>Batería HMI (Vcc)</label><input type="number" placeholder="Vcc"></div></div><div class="ronda-notes"><label>Anomalías</label><input type="text" placeholder="Sin anomalías..."></div>';wrap.appendChild(d);document.getElementById('g'+g+'_ronda_lbl').textContent='Ronda '+n+' activa';d.scrollIntoView({behavior:'smooth',block:'start'});}
function checkFuel(g,el){var v=parseInt(el.value),alertEl=document.getElementById('g'+g+'_alert_fuel');if(alertEl)alertEl.classList.toggle('show',el.value!==''&&v<50);}
function stop(e){e.stopPropagation();}
function switchGen(g){document.getElementById('gen-panel-'+currentGen).classList.remove('active');document.querySelector('.gen-tab[data-gen="'+currentGen+'"]').classList.remove('active');currentGen=g;document.getElementById('gen-panel-'+g).classList.add('active');document.querySelector('.gen-tab[data-gen="'+g+'"]').classList.add('active');updateProgress(g);}
function updateTabStyle(g){var all=[].concat.apply([],Object.values(SECS)),done=all.filter(function(i){return genStates[g][i];}).length;var tab=document.querySelector('.gen-tab[data-gen="'+g+'"]');if(tab)tab.classList.toggle('has-items',done>0);}
function updateTabLabel(g){var panel=document.getElementById('gen-panel-'+g);var osInput=panel&&panel.querySelector('.os-num-input');var os=osInput&&osInput.value.trim();var tab=document.querySelector('.gen-tab[data-gen="'+g+'"]');if(tab)tab.textContent='Gen '+g+(os?' · '+os:'');}
function addGen(){if(genCount>=MAX_GENS){alert('Máximo '+MAX_GENS+' generadores');return;}genCount++;initGenData(genCount);var tabBar=document.getElementById('gen-tab-bar');var addBtn=tabBar.querySelector('.btn-add-gen');var btn=document.createElement('button');btn.className='gen-tab';btn.dataset.gen=genCount;btn.textContent='Gen '+genCount;(function(n){btn.onclick=function(){switchGen(n);};})(genCount);tabBar.insertBefore(btn,addBtn);var container=document.getElementById('gen-panels');var div=document.createElement('div');div.className='gen-panel';div.id='gen-panel-'+genCount;div.innerHTML=buildPanel(genCount);container.appendChild(div);var fd=div.querySelector('.f-fecha');if(fd)fd.value=new Date().toISOString().slice(0,10);switchGen(genCount);}
function resetGen(g){if(!confirm('Reiniciar checklist del Generador '+g+'?'))return;genStates[g]={};var panel=document.getElementById('gen-panel-'+g);panel.querySelectorAll('.item').forEach(function(el){el.classList.remove('done');});panel.querySelectorAll('.check-box').forEach(function(el){el.classList.remove('on');});Object.keys(SECS).forEach(function(s){updateBadge(g,s);});if(g===currentGen)updateProgress(g);updateTabStyle(g);}
function buildPanel(g){return '<div class="os-banner"><div class="os-field"><label>Orden de Servicio</label><input type="text" class="os-num-input" placeholder="OS-2024-001" oninput="updateTabLabel('+g+')"></div><div class="os-sep">|</div><div class="os-field"><label>Site / Unidad</label><input type="text" placeholder="Nombre del site"></div><div class="os-sep">|</div><div class="os-field"><label>Generador / Marca</label><input type="text" placeholder="Caterpillar 500kW"></div></div><div class="main"><div class="card"><div class="card-header" onclick="toggleCard(this)"><div class="card-title">📋 INFORMACIÓN DEL SERVICIO</div><span class="card-chevron open">▼</span></div><div class="card-body"><div class="fields-grid"><div class="field"><label># Serie</label><input type="text" placeholder="3018515194"></div><div class="field"><label>Realizado por</label><input type="text" placeholder="Nombre técnico"></div><div class="field"><label>Aprobado por</label><input type="text" placeholder="Nombre aprobador"></div><div class="field"><label>Fecha</label><input type="date" class="f-fecha"></div><div class="field"><label>Hora inicio</label><input type="time" class="f-inicio"></div><div class="field"><label>Horómetro inicio (hrs)</label><input type="number" placeholder="Hrs"></div><div class="field"><label>Tanque Base (%)</label><input type="number" min="0" max="100" placeholder="%" oninput="checkFuel('+g+',this)"></div><div class="field"><label>Tanque de Día (%)</label><input type="number" min="0" max="100" placeholder="%" oninput="checkFuel('+g+',this)"></div></div><div class="alert-banner yellow" id="g'+g+'_alert_fuel">⚠️ Nivel bajo. Notificar reabastecimiento urgente.</div></div></div><div class="card"><div class="card-header" onclick="toggleCard(this)"><div class="card-title">🟢 1. AL ARRANCAR EL GENERADOR</div><span class="card-badge" id="g'+g+'_b_s1">0 / 6</span><span class="card-chevron open">▼</span></div><div class="card-body"><div class="item" id="g'+g+'_i1" onclick="tick('+g+','i1','s1')"><div class="check-box" id="g'+g+'_c1"></div><div class="item-num">1</div><div class="item-body"><div class="item-desc">Sistema arrancó en modo AUTOMÁTICO</div><div class="item-inputs" onclick="stop(event)"><label>Resultado</label><select><option value="">-</option><option>✅ Automático</option><option>⚠️ Manual</option><option>❌ Falló</option></select></div></div></div><div class="item" id="g'+g+'_i2" onclick="tick('+g+','i2','s1')"><div class="check-box" id="g'+g+'_c2"></div><div class="item-num">2</div><div class="item-body"><div class="item-desc">Estatus de respaldo de equipos</div><div class="item-hint">UPS, servidores, luces de emergencia, climatización</div><div class="item-inputs" onclick="stop(event)"><label>Estatus</label><select><option value="">-</option><option>✅ OK — Operando normal</option><option>⚠️ Parcial — Algunos sin respaldo</option><option>❌ Sin respaldo</option></select><label>Detalle</label><input type="text" class="w160" placeholder="Anotar equipos con falla..."></div></div></div><div class="item" id="g'+g+'_i3" onclick="tick('+g+','i3','s1')"><div class="check-box" id="g'+g+'_c3"></div><div class="item-num">3</div><div class="item-body"><div class="item-desc">Nivel combustible ≥ 75% — Tanque Base y Tanque de Día</div><div class="item-inputs" onclick="stop(event)"><label>Base (%)</label><input type="number" min="0" max="100" placeholder="%"><label>Día (%)</label><input type="number" min="0" max="100" placeholder="%"><label>Hora</label><input type="time"></div></div></div><div class="item" id="g'+g+'_i4" onclick="tick('+g+','i4','s1')"><div class="check-box" id="g'+g+'_c4"></div><div class="item-num">4</div><div class="item-body"><div class="item-desc">Sin fugas visibles (combustible, aceite, refrigerante)</div><div class="item-inputs" onclick="stop(event)"><label>Estado</label><select><option value="">-</option><option>✅ Sin fugas</option><option>⚠️ Fuga menor</option><option>🚨 Fuga importante</option></select></div></div>
